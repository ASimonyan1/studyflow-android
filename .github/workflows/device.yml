name: Device tests and screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/androidTest/**'
      - '.github/workflows/device.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle connectedDebugAndroidTest --no-daemon
            mkdir -p screenshots
            adb exec-out run-as dev.asimonyan.studyflow cat files/studyflow-home.png > screenshots/studyflow-home.png
            adb exec-out run-as dev.asimonyan.studyflow cat files/studyflow-editor.png > screenshots/studyflow-editor.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-evidence
          path: |
            screenshots/
            app/build/reports/androidTests/
